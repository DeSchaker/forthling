[package]
name = "forthling-web"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "forthling in the browser: a WebAssembly module and a playground page"
license = "MIT"
repository = "https://github.com/DeSchaker/forthling"
publish = false

# A workspace of its own, like python/, sqlite/ and mcp/.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
forthling = { path = ".." }
forthling-regex = { path = "../regex" }

# Small and fast to load: the .wasm goes over the network.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[lints.clippy]
# All of pedantic, so that new code cannot bring the warnings back; CI runs clippy
# with `-D warnings`. Priority -1 lets the lints below this line override the group.
pedantic = { level = "warn", priority = -1 }
# `use crate::*;` is a convention of this project: a module sees what its parent sees.
wildcard_imports = "allow"
