[package]
name = "forthling-http"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "HTTP client words for forthling, a Forth interpreter in Rust"
license = "MIT"
repository = "https://github.com/DeSchaker/forthling"
readme = "README.md"
keywords = ["forth", "http", "interpreter"]
categories = ["network-programming"]

# A workspace of its own, so the core keeps its own Cargo.lock without ureq.
[workspace]

[[bin]]
name = "forthling-http"
path = "src/main.rs"

[dependencies]
forthling = { path = "..", version = "0.2.0" }
# rustls with the Mozilla roots; no gzip, so that a response is the bytes sent.
ureq = { version = "3", default-features = false, features = ["rustls"] }

[lints.clippy]
# All of pedantic, so that new code cannot bring the warnings back; CI runs clippy
# with `-D warnings`. Priority -1 lets the lints below this line override the group.
pedantic = { level = "warn", priority = -1 }
# `use crate::*;` is a convention of this project: a module sees what its parent sees.
wildcard_imports = "allow"
