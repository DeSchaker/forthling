name: Bug report
description: forthling does something wrong, or differs from Forth-2012.
labels: [bug]
body:
  - type: textarea
    id: code
    attributes:
      label: Forth code
      description: A few lines of Forth that show the problem.
      render: forth
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What forthling did
      description: The output or error message, exactly as shown.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: If it is about the standard, name the word and, if you can, the section.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The commit you built (`git rev-parse --short HEAD`).
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11, Ubuntu 24.04, macOS 15, …
