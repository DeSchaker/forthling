name: Pages

# Publishes the playground (web/www/ with a freshly built forthling.wasm) on
# GitHub Pages: https://deschaker.github.io/forthling/, with llms.txt beside it.
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "src/**"
      - "Cargo.toml"
      - "llms.txt"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces one that is waiting.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: web
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo build --release --manifest-path web/Cargo.toml --target wasm32-unknown-unknown
      - run: node --test web/tests/forthling.test.mjs
      - run: cp web/target/wasm32-unknown-unknown/release/forthling_web.wasm web/www/forthling.wasm
      - run: cp llms.txt web/www/llms.txt
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/www

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
