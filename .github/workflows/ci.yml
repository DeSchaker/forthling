name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # The Forth-2012 test suite, at the commit the README names.
  SUITE_REPO: https://github.com/gerryjackson/forth2012-test-suite.git
  SUITE_COMMIT: 4c87e56

jobs:
  # Formatting, lints and tests on the minimum supported Rust version
  # (rust-version in Cargo.toml), so CI checks exactly what we check locally.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Fetch the Forth-2012 test suite
        run: |
          git clone --quiet "$SUITE_REPO" tests/forth2012-test-suite
          git -C tests/forth2012-test-suite checkout --quiet "$SUITE_COMMIT"
      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # The tests on the latest stable Rust, on Linux and Windows.
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch the Forth-2012 test suite
        shell: bash
        run: |
          git clone --quiet "$SUITE_REPO" tests/forth2012-test-suite
          git -C tests/forth2012-test-suite checkout --quiet "$SUITE_COMMIT"
      - run: cargo test

  # The Python module in python/, a crate of its own with PyO3, on Python
  # 3.14, the version it is developed with.
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: python
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: cargo fmt --manifest-path python/Cargo.toml -- --check
      - run: cargo clippy --manifest-path python/Cargo.toml --all-targets -- -D warnings
      - run: pip install ./python
      - run: python -m unittest discover -s python/tests -v

  # The SQLite words in sqlite/, a crate of its own with rusqlite (which
  # builds SQLite itself), on its rust-version and on the latest stable.
  sqlite:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, rust: "1.85" }
          - { os: ubuntu-latest, rust: stable }
          - { os: windows-latest, rust: stable }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sqlite
      - run: cargo fmt --manifest-path sqlite/Cargo.toml -- --check
      - run: cargo clippy --manifest-path sqlite/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path sqlite/Cargo.toml

  # The MCP server in mcp/, a crate of its own (serde_json), with and
  # without the SQLite words.
  mcp:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, rust: "1.85" }
          - { os: ubuntu-latest, rust: stable }
          - { os: windows-latest, rust: stable }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mcp
      - run: cargo fmt --manifest-path mcp/Cargo.toml -- --check
      - run: cargo clippy --manifest-path mcp/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path mcp/Cargo.toml
      - run: cargo test --manifest-path mcp/Cargo.toml --no-default-features

  # forthling in the browser: web/ builds a WebAssembly module (no
  # dependencies, no wasm-bindgen), which Node tests through www/forthling.js.
  web:
    strategy:
      matrix:
        rust: ["1.85", stable]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: web
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo fmt --manifest-path web/Cargo.toml -- --check
      - run: cargo clippy --manifest-path web/Cargo.toml --target wasm32-unknown-unknown -- -D warnings
      - run: cargo clippy --lib --target wasm32-unknown-unknown -- -D warnings
      - run: cargo build --release --manifest-path web/Cargo.toml --target wasm32-unknown-unknown
      - run: node --test web/tests/forthling.test.mjs
