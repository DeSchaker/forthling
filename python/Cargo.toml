[package]
name = "forthling-py"
version = "0.1.0"
edition = "2021"
description = "Python bindings for forthling, a Forth interpreter in Rust"
license = "MIT"
repository = "https://github.com/DeSchaker/forthling"
publish = false

# A workspace of its own, so the core keeps its own Cargo.lock without PyO3.
[workspace]

[lib]
name = "forthling_py"
crate-type = ["cdylib"]

[dependencies]
forthling = { path = ".." }
pyo3 = { version = "0.30", features = ["extension-module"] }
