[package]
name = "forthling-py"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Python bindings for forthling, a Forth interpreter in Rust"
license = "MIT"
repository = "https://github.com/DeSchaker/forthling"
publish = false

# A workspace of its own, so the core keeps its own Cargo.lock without PyO3.
[workspace]

[lib]
name = "forthling_py"
crate-type = ["cdylib"]

[dependencies]
forthling = { path = ".." }
forthling-regex = { path = "../regex" }
forthling-http = { path = "../http" }
pyo3 = { version = "0.30", features = ["extension-module"] }

[lints.clippy]
# All of pedantic, so that new code cannot bring the warnings back; CI runs clippy
# with `-D warnings`. Priority -1 lets the lints below this line override the group.
pedantic = { level = "warn", priority = -1 }
# `use crate::*;` is a convention of this project: a module sees what its parent sees.
wildcard_imports = "allow"
