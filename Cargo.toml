[package]
name = "forthling"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "A Forth-2012 system in Rust: no dependencies, a sandbox, JSON words and a tutorial"
license = "MIT"
repository = "https://github.com/DeSchaker/forthling"
readme = "README.md"
keywords = ["forth", "interpreter", "repl", "stack", "language"]
categories = ["compilers", "command-line-utilities"]
# What goes to crates.io: the code, its tests and the documents the README links to.
include = ["/src", "/tests/*.rs", "/tests/*.fth", "/examples", "/README.md", "/LICENSE", "/COMPLIANCE.md", "/llms.txt"]

[dependencies]

[lints.clippy]
# All of pedantic, so that new code cannot bring the warnings back; CI runs clippy
# with `-D warnings`. Priority -1 lets the lints below this line override the group.
pedantic = { level = "warn", priority = -1 }
# `use crate::*;` is a convention of this project: a module sees what its parent sees.
wildcard_imports = "allow"

[profile.release]
lto = true
codegen-units = 1
