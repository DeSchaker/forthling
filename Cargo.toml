[package]
name = "forthling"
version = "0.2.2"
edition = "2024"
rust-version = "1.85"
description = "A Forth-2012 system in Rust: no dependencies, a sandbox, JSON words and a tutorial"
license = "MIT"
repository = "https://github.com/DeSchaker/forthling"
readme = "README.md"
keywords = ["forth", "interpreter", "repl", "stack", "language"]
categories = ["compilers", "command-line-utilities"]
# What goes to crates.io: the code, its tests and the documents the README links to.
include = ["/src", "/tests/*.rs", "/tests/*.fth", "/examples", "/benches", "/README.md", "/LICENSE", "/COMPLIANCE.md", "/llms.txt"]

[dependencies]

[features]
# The text of HELP (src/help.txt, about 50 KB in a release build); without it HELP still shows the comments of the program's own words.
default = ["help"]
help = []

[[bench]]
name = "bench"
harness = false

[lints.rust]
# CONTRIBUTING.md: this crate has no `unsafe` code, and the compiler keeps it so.
unsafe_code = "forbid"

[lints.clippy]
# All of pedantic, so that new code cannot bring the warnings back; CI runs clippy
# with `-D warnings`. Priority -1 lets the lints below this line override the group.
pedantic = { level = "warn", priority = -1 }
# `use crate::*;` is a convention of this project: a module sees what its parent sees.
wildcard_imports = "allow"

[profile.release]
lto = true
codegen-units = 1
