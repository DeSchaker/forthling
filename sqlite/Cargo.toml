[package]
name = "forthling-sqlite"
version = "0.2.5"
edition = "2024"
rust-version = "1.85"
description = "SQLite words for forthling, a Forth interpreter in Rust"
license = "MIT"
repository = "https://github.com/DeSchaker/forthling"
readme = "README.md"
keywords = ["forth", "sqlite", "interpreter"]
categories = ["database"]

# A workspace of its own, so the core keeps its own Cargo.lock without rusqlite.
[workspace]

[[bin]]
name = "forthling-sqlite"
path = "src/main.rs"

[dependencies]
forthling = { path = "..", version = "0.2.5" }
rusqlite = { version = "0.40", features = ["bundled", "hooks", "limits"] }

[profile.release]
# The profile of the core does not apply when it is a dependency, so this crate sets its own.
lto = true
codegen-units = 1

[lints.rust]
# CONTRIBUTING.md: this crate has no `unsafe` code, and the compiler keeps it so.
unsafe_code = "forbid"

[lints.clippy]
# All of pedantic, so that new code cannot bring the warnings back; CI runs clippy
# with `-D warnings`. Priority -1 lets the lints below this line override the group.
pedantic = { level = "warn", priority = -1 }
# `use crate::*;` is a convention of this project: a module sees what its parent sees.
wildcard_imports = "allow"
