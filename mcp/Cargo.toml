[package]
name = "forthling-mcp"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "An MCP server that runs Forth in forthling's sandbox, for AI agents"
license = "MIT"
repository = "https://github.com/DeSchaker/forthling"
readme = "README.md"
keywords = ["mcp", "forth", "sandbox", "ai", "agent"]
categories = ["command-line-utilities", "development-tools"]

# A workspace of its own, so the core keeps its own Cargo.lock without serde_json.
[workspace]

[[bin]]
name = "forthling-mcp"
path = "src/main.rs"

[features]
default = ["sqlite", "regex"]
# The SQLite words, for :memory: databases.
sqlite = ["dep:forthling-sqlite"]
# The regular expression words.
regex = ["dep:forthling-regex"]
# The HTTP words, for the hosts of --allow-host; off by default, since they reach the network.
http = ["dep:forthling-http"]

[dependencies]
forthling = { path = "..", version = "0.2.0" }
forthling-sqlite = { path = "../sqlite", version = "0.2.0", optional = true }
forthling-regex = { path = "../regex", version = "0.2.0", optional = true }
forthling-http = { path = "../http", version = "0.2.0", optional = true }
serde_json = "1"

[lints.clippy]
# All of pedantic, so that new code cannot bring the warnings back; CI runs clippy
# with `-D warnings`. Priority -1 lets the lints below this line override the group.
pedantic = { level = "warn", priority = -1 }
# `use crate::*;` is a convention of this project: a module sees what its parent sees.
wildcard_imports = "allow"
